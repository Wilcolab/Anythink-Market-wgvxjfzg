name: MongoDB Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  verify-mongodb-connection:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MONGO_INITDB_DATABASE: anythink-market

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install MongoDB tools
        run: npm install -g mongodb

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..30}; do
            if npx mongodb-shell mongodb://localhost:27017 --eval "db.version()" > /dev/null 2>&1; then
              echo "✓ MongoDB is ready"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for MongoDB..."
            sleep 1
          done
          echo "✗ MongoDB failed to start"
          exit 1

      - name: Create test database and collections
        run: |
          npx mongodb-shell mongodb://localhost:27017/anythink-market --eval "
          db.createCollection('users');
          db.createCollection('items');
          db.createCollection('comments');
          db.users.createIndex({ username: 1 }, { unique: true });
          db.users.createIndex({ email: 1 }, { unique: true });
          db.items.createIndex({ author: 1 });
          db.items.createIndex({ createdAt: -1 });
          db.comments.createIndex({ author: 1 });
          db.comments.createIndex({ article: 1 });
          print('Collections and indexes created successfully');
          "

      - name: Verify collections
        run: |
          npx mongodb-shell mongodb://localhost:27017/anythink-market --eval "
          const stats = db.getCollectionStats('users');
          print('Users collection: ' + JSON.stringify(stats, null, 2));
          "

  backend-integration-test:
    runs-on: ubuntu-latest
    needs: verify-mongodb-connection

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "✓ MongoDB port is open"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for MongoDB port..."
            sleep 1
          done
          exit 1

      - name: Initialize database with seeds
        working-directory: ./backend
        env:
          MONGODB_URI: mongodb://localhost:27017/anythink-market
          NODE_ENV: test
        run: npm run seeds || echo "Seeds script not found, continuing..."

      - name: Start backend server
        working-directory: ./backend
        env:
          MONGODB_URI: mongodb://localhost:27017/anythink-market
          NODE_ENV: test
          PORT: 3000
        run: |
          npm start &
          BACKEND_PID=$!
          echo $BACKEND_PID > /tmp/backend.pid
          sleep 2

      - name: Health check backend
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/ping; then
              echo ""
              echo "✓ Backend is healthy"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for backend..."
            sleep 1
          done
          echo "✗ Backend health check failed"
          curl -v http://localhost:3000/api/ping || true
          exit 1

      - name: Run Postman API tests
        working-directory: ./backend
        env:
          MONGODB_URI: mongodb://localhost:27017/anythink-market
          NODE_ENV: test
        continue-on-error: false
        run: npm test

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi
          pkill -f "node app.js" || true
